name: build-dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 编译
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 发布 dylib
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kd-latest
          name: kd-latest
          files: build/AutoScroll.dylib
          fail_on_unmatched_files: true
